<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>ALT Generator Preview</title><style>body{margin:0;background:#081120;color:#f8fafc;font-family:system-ui,sans-serif}.w{width:min(900px,92vw);margin:auto;padding:48px 0}.card{border:1px solid #334155;border-radius:20px;padding:24px;background:#101d32}h1{font-size:clamp(2rem,6vw,4rem)}p{color:#a8bbd3}input{margin:12px 0}.btn{display:inline-flex;min-height:46px;padding:0 18px;align-items:center;border:0;border-radius:12px;background:#1f4fd1;color:white;font-weight:700;cursor:pointer}.btn:disabled{opacity:.5}.out{margin-top:18px;padding:16px;border:1px solid #334155;border-radius:14px;background:#091321}.back{color:#38bdf8}</style></head><body><main class="w"><a class="back" href="index.html">← المختبر</a><h1>ALT & Caption</h1><p>اختر صورة. يعمل النموذج محلياً داخل المتصفح عند بدء التحليل.</p><section class="card"><input id="f" type="file" accept="image/png,image/jpeg,image/webp"><br><button id="run" class="btn" disabled>حلّل الصورة</button><div id="s" class="out">اختر صورة للبدء.</div><div id="r" class="out" hidden><strong>الوصف</strong><p id="cap"></p><strong>ALT</strong><p id="alt"></p><button id="copy" class="btn">نسخ ALT</button></div></section></main><script type="module">const MODEL='Xenova/vit-gpt2-image-captioning';const f=document.getElementById('f'),run=document.getElementById('run'),s=document.getElementById('s'),r=document.getElementById('r'),cap=document.getElementById('cap'),alt=document.getElementById('alt');let url=null,pipe=null,T=null;f.onchange=()=>{const x=f.files?.[0];if(!x)return;if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(x);run.disabled=false;s.textContent='جاهز. سيبدأ تحميل النموذج عند الضغط.'};async function load(){if(pipe)return pipe;if(!T)T=await import('https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.8.1');const opts={dtype:'q8'};if(navigator.gpu)opts.device='webgpu';try{pipe=await T.pipeline('image-to-text',MODEL,opts)}catch{pipe=await T.pipeline('image-to-text',MODEL,{dtype:'q8'})}return pipe}run.onclick=async()=>{if(!url)return;run.disabled=true;s.textContent='جارٍ التحليل محلياً…';try{const p=await load();const o=await p(url,{max_new_tokens:48});const t=String(o?.[0]?.generated_text||o?.[0]?.caption||'').replace(/\s+/g,' ').trim();if(!t)throw new Error();cap.textContent=t;alt.textContent=t.slice(0,180);r.hidden=false;s.textContent='تم التحليل. راجع النص قبل استخدامه.'}catch(e){console.error(e);s.textContent='تعذر تشغيل النموذج في هذا المتصفح.'}finally{run.disabled=false}};document.getElementById('copy').onclick=async()=>{await navigator.clipboard.writeText(alt.textContent);s.textContent='تم النسخ.'}</script></body></html>
