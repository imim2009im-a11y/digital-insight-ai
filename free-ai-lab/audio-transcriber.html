<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Whisper Transcriber Preview</title><style>body{margin:0;background:#081120;color:#f8fafc;font-family:system-ui,sans-serif}.w{width:min(900px,92vw);margin:auto;padding:48px 0}.card{border:1px solid #334155;border-radius:20px;padding:24px;background:#101d32}h1{font-size:clamp(2rem,6vw,4rem)}p{color:#a8bbd3}.btn{display:inline-flex;min-height:46px;padding:0 18px;align-items:center;border:0;border-radius:12px;background:#1f4fd1;color:white;font-weight:700;cursor:pointer}.btn:disabled{opacity:.5}.back{color:#38bdf8}.status{margin-top:14px;color:#a7f3d0}textarea{width:100%;min-height:220px;margin-top:14px;border:1px solid #334155;border-radius:14px;background:#091321;color:white;padding:14px;font:inherit;box-sizing:border-box}audio{width:100%;margin:16px 0}</style></head><body><main class="w"><a class="back" href="index.html">← المختبر</a><h1>Whisper Transcriber</h1><p>تفريغ الصوت محلياً باستخدام Xenova/whisper-tiny وTransformers.js.</p><section class="card"><input id="f" type="file" accept="audio/*"><audio id="a" controls hidden></audio><p><button id="run" class="btn" disabled>ابدأ التفريغ</button> <button id="copy" class="btn" disabled>نسخ النص</button></p><div id="s" class="status">اختر ملفاً صوتياً للبدء.</div><textarea id="out" hidden aria-label="النص المستخرج"></textarea></section></main><script type="module">const f=document.getElementById('f'),a=document.getElementById('a'),run=document.getElementById('run'),copy=document.getElementById('copy'),s=document.getElementById('s'),out=document.getElementById('out');let src=null,pipe=null,T=null;f.onchange=()=>{const x=f.files?.[0];if(!x)return;if(src)URL.revokeObjectURL(src);src=URL.createObjectURL(x);a.src=src;a.hidden=false;run.disabled=false;copy.disabled=true;out.hidden=true;out.value='';s.textContent='جاهز. يبدأ تحميل Whisper عند الضغط.'};async function load(){if(pipe)return pipe;if(!T)T=await import('https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.8.1');const opts={dtype:'q8'};if(navigator.gpu)opts.device='webgpu';try{pipe=await T.pipeline('automatic-speech-recognition','Xenova/whisper-tiny',opts)}catch{pipe=await T.pipeline('automatic-speech-recognition','Xenova/whisper-tiny',{dtype:'q8'})}return pipe}run.onclick=async()=>{if(!src)return;run.disabled=true;s.textContent='جارٍ التفريغ محلياً…';try{const p=await load();const r=await p(src,{chunk_length_s:30,stride_length_s:5});const t=String(r?.text||'').trim();if(!t)throw new Error();out.value=t;out.hidden=false;copy.disabled=false;s.textContent='تم التفريغ. راجع النص قبل الاستخدام.'}catch(e){console.error(e);s.textContent='تعذر تفريغ الملف في هذا المتصفح أو بهذه الصيغة.'}finally{run.disabled=false}};copy.onclick=async()=>{await navigator.clipboard.writeText(out.value);s.textContent='تم النسخ.'}</script></body></html>
