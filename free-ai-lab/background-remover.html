<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Background Remover Preview</title><style>body{margin:0;background:#081120;color:#f8fafc;font-family:system-ui,sans-serif}.w{width:min(920px,92vw);margin:auto;padding:48px 0}.card{border:1px solid #334155;border-radius:20px;padding:24px;background:#101d32}h1{font-size:clamp(2rem,6vw,4rem)}p{color:#a8bbd3}.btn{display:inline-flex;min-height:46px;padding:0 18px;align-items:center;border:0;border-radius:12px;background:#1f4fd1;color:white;font-weight:700;cursor:pointer}.btn:disabled{opacity:.5}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px}.pane{min-height:240px;border:1px solid #334155;border-radius:14px;display:grid;place-items:center;overflow:hidden;background:#0b1424}.pane img{max-width:100%;max-height:400px}.back{color:#38bdf8}.status{margin-top:14px;color:#a7f3d0}@media(max-width:720px){.grid{grid-template-columns:1fr}}</style></head><body><main class="w"><a class="back" href="index.html">← المختبر</a><h1>إزالة الخلفية</h1><p>تعمل المعالجة محلياً باستخدام Xenova/modnet وTransformers.js.</p><section class="card"><input id="f" type="file" accept="image/png,image/jpeg,image/webp"><div class="grid"><div class="pane"><img id="before" alt="الأصل"></div><div class="pane"><img id="after" alt="النتيجة"></div></div><p><button id="run" class="btn" disabled>إزالة الخلفية</button> <a id="dl" class="btn" style="display:none;text-decoration:none" download="background-removed.png">تنزيل PNG</a></p><div id="s" class="status">اختر صورة للبدء.</div></section></main><script type="module">const f=document.getElementById('f'),before=document.getElementById('before'),after=document.getElementById('after'),run=document.getElementById('run'),dl=document.getElementById('dl'),s=document.getElementById('s');let src=null,out=null,pipe=null,T=null;f.onchange=()=>{const x=f.files?.[0];if(!x)return;if(src)URL.revokeObjectURL(src);if(out)URL.revokeObjectURL(out);src=URL.createObjectURL(x);before.src=src;after.removeAttribute('src');dl.style.display='none';run.disabled=false;s.textContent='جاهز. يبدأ تحميل النموذج عند الضغط.'};async function load(){if(pipe)return pipe;if(!T)T=await import('https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.8.1');pipe=await T.pipeline('background-removal','Xenova/modnet',{dtype:'fp32'});return pipe}run.onclick=async()=>{if(!src)return;run.disabled=true;s.textContent='جارٍ المعالجة محلياً…';try{const p=await load();const o=await p(src);if(!o?.[0])throw new Error();const b=await o[0].toBlob();out=URL.createObjectURL(b);after.src=out;dl.href=out;dl.style.display='inline-flex';s.textContent='تمت المعالجة. راجع الحواف قبل الاستخدام.'}catch(e){console.error(e);s.textContent='تعذر تشغيل النموذج في هذا المتصفح.'}finally{run.disabled=false}}</script></body></html>
