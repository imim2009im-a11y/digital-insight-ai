name: Feature request
description: Suggest a focused improvement with a clear user outcome.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or opportunity
      description: What user or operational problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the smallest useful solution.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List observable conditions for completion.
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: Scope checklist
      options:
        - label: This request does not require moving the production domain or hosting platform.
        - label: This request does not include secrets, credentials, or private user data.
