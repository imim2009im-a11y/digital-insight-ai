name: Publisher Security Regression
on:
  pull_request:
    branches:
      - digital-insight-publisher
    paths:
      - 'publisher/server.mjs'
      - 'publisher/test.mjs'
      - '.github/workflows/publisher-security-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout verified source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Syntax and isolated scheduler-auth tests
        shell: bash
        run: |
          set -euo pipefail
          node --check publisher/server.mjs
          node --check publisher/test.mjs
          node publisher/test.mjs
