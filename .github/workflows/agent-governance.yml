name: Agent Governance Verification

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify changed-file whitespace
        if: github.event_name == 'pull_request'
        run: git diff --check "origin/${{ github.base_ref }}...HEAD"

      - name: Run consolidated agent verification
        run: python3 scripts/ia_preflight.py --timeout 120 --attempts 1

      - name: Record bounded execution evidence
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import subprocess

          git_dir = Path(subprocess.check_output(["git", "rev-parse", "--absolute-git-dir"], text=True).strip())
          evidence = git_dir / "ia-preflight" / "evidence.json"
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("## IA bounded source verification\n\n")
              if not evidence.is_file():
                  summary.write("Evidence unavailable; inspect the failed step.\n")
              else:
                  data = json.loads(evidence.read_text())
                  allowed = {key: data[key] for key in ("schema_version", "status", "run_id", "fingerprint", "runtime_fingerprint", "exit_code", "duration_seconds") if key in data}
                  summary.write("```json\n" + json.dumps(allowed, sort_keys=True) + "\n```\n")
          PY
