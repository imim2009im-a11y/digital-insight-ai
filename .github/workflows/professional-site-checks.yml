name: Professional Site Checks
on:
  pull_request:
    branches: [main]
    paths:
      - "site/**"
      - "scripts/site-professional-check.py"
      - "scripts/site-interactions.test.cjs"
      - "scripts/site-browser-e2e.cjs"
      - ".github/workflows/professional-site-checks.yml"
  push:
    branches: [main]
    paths:
      - "site/**"
      - "scripts/site-professional-check.py"
      - ".github/workflows/professional-site-checks.yml"
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - name: Check static content / metadata / links / sitemap
        run: python3 scripts/site-professional-check.py
      - name: Keep public news RSS synchronized with articles
        run: python3 scripts/build-news-feed.py
      - name: JavaScript syntax
        run: |
          node --check site/assets/app.js
          node --check site/assets/directory.js
          node --check site/assets/site.js
      - name: Exercise search, calculator and share interactions
        run: node --test scripts/site-interactions.test.cjs

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - name: Install isolated headless browser harness
        shell: bash
        run: |
          npm install --no-save --no-package-lock --ignore-scripts \
            --prefix "$RUNNER_TEMP/site-browser-qa" playwright@1.58.2
          if ! command -v google-chrome >/dev/null 2>&1; then
            "$RUNNER_TEMP/site-browser-qa/node_modules/.bin/playwright" install chromium
          fi
      - name: Verify all pages at 320/390/768/1365 widths
        shell: bash
        run: NODE_PATH="$RUNNER_TEMP/site-browser-qa/node_modules" node scripts/site-browser-e2e.cjs
