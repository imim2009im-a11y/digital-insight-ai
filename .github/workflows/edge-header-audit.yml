name: Edge Response Header Evidence

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/edge_headers_audit.py"
      - "tests/test_edge_headers_audit.py"
      - ".github/workflows/edge-header-audit.yml"
      - "docs/security/cloudflare-edge-readiness.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: edge-header-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  header-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - name: Python syntax and offline header policy tests
        run: |
          python3 -m py_compile scripts/edge_headers_audit.py tests/test_edge_headers_audit.py
          python3 -m unittest discover -s tests -p test_edge_headers_audit.py -v
      - name: Observe canonical public HTTPS response on explicit manual run only
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          echo "## Public response headers (observation, not enforcement)" >> "$GITHUB_STEP_SUMMARY"
          python3 scripts/edge_headers_audit.py --live --strict | tee edge-header-observation.json
          cat edge-header-observation.json >> "$GITHUB_STEP_SUMMARY"
