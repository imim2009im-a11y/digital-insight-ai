name: Publisher Preflight Regression

on:
  pull_request:
    branches: [digital-insight-publisher]
    paths:
      - "publisher/**"
      - ".github/workflows/publisher-preflight-regression.yml"

permissions:
  contents: read

concurrency:
  group: publisher-preflight-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  isolated-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout pinned action
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify Node.js source syntax
        run: |
          node --check publisher/server.mjs
          node --check publisher/test.mjs
      - name: Run isolated publisher authentication and preflight tests
        working-directory: publisher
        env:
          TELEGRAM_BOT_TOKEN: ""
          TELEGRAM_CHAT_ID: ""
          DISCORD_WEBHOOK_URL: ""
        run: npm test
