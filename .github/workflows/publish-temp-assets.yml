name: Generate YouTube Publish Assets

on:
  push:
    branches: [publish-temp]
    paths:
      - 'publish_temp/**'
      - '.github/workflows/publish-temp-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-temp-assets
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: publish-temp
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fontconfig fonts-noto-core
      - name: Install Python dependencies
        run: pip install -r publish_temp/requirements.txt
      - name: Generate MP4, thumbnail and metadata
        run: python publish_temp/generate.py
      - name: Commit generated assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add publish_temp/generated
          if git diff --cached --quiet; then
            echo 'No asset changes.'
          else
            git commit -m 'chore: publish generated YouTube assets [skip ci]'
            git push origin HEAD:publish-temp
          fi
