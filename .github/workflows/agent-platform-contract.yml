name: Agent Platform Contract
on:
  pull_request:
    paths:
      - 'docs/agent-platform/**'
      - 'scripts/agent-platform/**'
      - 'examples/agent-platform/**'
      - '.github/workflows/agent-platform-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate prototype and negative gate
        run: bash scripts/agent-platform/test_contract.sh
