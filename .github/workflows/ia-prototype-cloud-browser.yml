name: IA Prototype Cloud Browser QA

on:
  pull_request:
    branches: [main]
    paths:
      - "prototypes/ia-command-center/**"
      - "scripts/ia-command-center-e2e.cjs"
      - ".github/workflows/ia-prototype-cloud-browser.yml"

permissions:
  contents: read

jobs:
  ia-prototype-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - name: Checkout branch snapshot
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Prepare isolated Playwright runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ia-prototype-qa"
          npm install --no-save --no-package-lock --ignore-scripts \
            --prefix "$RUNNER_TEMP/ia-prototype-qa" playwright@1.58.2
          if ! command -v google-chrome >/dev/null 2>&1; then
            "$RUNNER_TEMP/ia-prototype-qa/node_modules/.bin/playwright" install chromium
          fi

      - name: Test IA prototype in Chromium (320, 390, 768, 1365)
        shell: bash
        run: NODE_PATH="$RUNNER_TEMP/ia-prototype-qa/node_modules" node scripts/ia-command-center-e2e.cjs

      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ia-command-center-screenshots
          path: artifacts/ia-command-center/*.png
          if-no-files-found: warn
          retention-days: 7
