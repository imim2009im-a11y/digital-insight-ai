name: Public Site Monitor
on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/public-site-smoke.py"
      - ".github/workflows/public-site-monitor.yml"
  workflow_run:
    workflows: ["Pages Production Deploy"]
    types: [completed]
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - name: Validate smoke-check script
        run: python3 -m py_compile scripts/public-site-smoke.py
      - name: Verify live canonical pages after deployment and daily
        if: ${{ github.event_name != 'pull_request' }}
        run: python3 scripts/public-site-smoke.py
