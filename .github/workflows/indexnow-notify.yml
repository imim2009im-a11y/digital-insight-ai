name: IndexNow Discovery Notification
on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/indexnow-submit.py"
      - ".github/workflows/indexnow-notify.yml"
      - "site/*.txt"
  workflow_run:
    workflows: ["Pages Production Deploy"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  notify:
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Check script syntax
        run: python3 -m py_compile scripts/indexnow-submit.py
      - name: Preflight (no request for pull requests)
        if: ${{ github.event_name == 'pull_request' }}
        run: python3 scripts/indexnow-submit.py --dry-run --all
      - name: Notify participating engines
        if: ${{ github.event_name != 'pull_request' }}
        run: python3 scripts/indexnow-submit.py ${{ github.event_name == 'workflow_dispatch' && '--all' || '' }}
