name: WordPress Runtime Check

on:
  pull_request:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'deploy-bin/**'
      - 'dia-entrypoint.sh'
      - 'dia-db-gate.php'
      - 'dia-health.php'
      - 'tools.html'
      - 'style.css'
      - 'script.js'
      - '.github/workflows/wordpress-runtime-check.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wordpress-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Build production WordPress image
        shell: bash
        run: docker build --pull --tag digital-insight-ai-runtime-check .

      - name: Verify runtime files and Apache configuration
        shell: bash
        run: |
          docker run --rm --entrypoint bash digital-insight-ai-runtime-check -lc \
            'php -l /usr/local/bin/dia-db-gate.php && php -l /var/www/dia-health.php && test -f /usr/src/wordpress/tools/index.html && test -f /usr/src/wordpress/tools/style.css && test -f /usr/src/wordpress/tools/script.js && grep -q "AI Tools Directory" /usr/src/wordpress/tools/index.html && grep -q "https://digitalinsightai.com/tools/" /usr/src/wordpress/tools/index.html && apache2ctl -t'

      - name: Smoke test embedded /tools assets
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name dia-tools-smoke \
            -p 127.0.0.1:18080:80 \
            -e WORDPRESS_DB_HOST=127.0.0.1:3306 \
            -e WORDPRESS_DB_USER=smoke \
            -e WORDPRESS_DB_PASSWORD=smoke \
            -e WORDPRESS_DB_NAME=smoke \
            digital-insight-ai-runtime-check
          trap 'docker rm -f dia-tools-smoke >/dev/null 2>&1 || true' EXIT

          ready=0
          for _ in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:18080/tools/ | grep -q 'AI Tools Directory'; then
              ready=1
              break
            fi
            sleep 1
          done

          if [ "$ready" -ne 1 ]; then
            docker logs dia-tools-smoke
            exit 1
          fi

          curl -fsS http://127.0.0.1:18080/tools/style.css | grep -q 'site-header'
          curl -fsS http://127.0.0.1:18080/tools/script.js | grep -q 'affiliate_click'
          curl -fsSI http://127.0.0.1:18080/tools | grep -q '308'
