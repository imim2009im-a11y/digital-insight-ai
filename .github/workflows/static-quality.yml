name: Static Site Quality Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: static-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - name: Validate static production target
        shell: bash
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urlsplit
          import sys

          root = Path("site")
          required = [
              "index.html", "tools/index.html", "reviews/index.html",
              "guides/index.html", "about/index.html", "privacy/index.html",
              "404.html", "robots.txt", "sitemap.xml", "_headers", "_redirects"
          ]
          missing = [p for p in required if not (root / p).is_file()]
          if missing:
              print("Missing static production files:", ", ".join(missing), file=sys.stderr)
              sys.exit(1)

          class Parser(HTMLParser):
              def __init__(self):
                  super().__init__(); self.refs=[]
              def handle_starttag(self, tag, attrs):
                  d=dict(attrs)
                  for key in ("href","src"):
                      if key in d: self.refs.append(d[key])

          broken=[]
          for html in root.rglob("*.html"):
              p=Parser(); p.feed(html.read_text(encoding="utf-8"))
              for raw in p.refs:
                  if not raw or raw.startswith(("#","mailto:","tel:","data:","javascript:")):
                      continue
                  u=urlsplit(raw)
                  if u.scheme or u.netloc:
                      continue
                  path=u.path
                  if not path:
                      continue
                  if path == "/":
                      target=root/"index.html"
                  elif path.startswith("/"):
                      rel=path.lstrip("/")
                      target=(root/rel) if "." in Path(rel).name else (root/rel/"index.html")
                  else:
                      target=(html.parent/path)
                  if not target.exists():
                      broken.append((str(html),raw))
          if broken:
              for f,ref in broken: print(f"{f}: {ref}", file=sys.stderr)
              sys.exit(1)
          print("Static production target validated.")
          PY

      - name: Reject runtime coupling and secrets
        shell: bash
        run: |
          set -euo pipefail
          if grep -RniE 'railway\.app|WORDPRESS_DB_|MONGODB_URI|mariadb' site --exclude=DEPLOY.md; then
            echo 'Runtime infrastructure coupling detected under site/.' >&2
            exit 1
          fi
          if find . -path './.git' -prune -o -type f \( -name '.env' -o -name '.env.*' -o -name '*.pem' -o -name '*.key' -o -name '*.p12' \) -print | grep -q .; then
            echo 'Sensitive deployment material detected.' >&2
            exit 1
          fi

      - name: Guard DNS cutover
        shell: bash
        run: |
          test ! -f CNAME || { echo 'Do not claim the custom domain from GitHub Pages staging.' >&2; exit 1; }
          test ! -f site/CNAME || { echo 'Do not claim the custom domain from staging.' >&2; exit 1; }
