name: Publisher Availability Monitor

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/publisher-watchdog.yml'

permissions:
  contents: read
  issues: write

concurrency:
  group: digital-insight-publisher-availability-monitor
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      APP_URL: 'https://digital-insight-publisher-zisqk8.v2.appdeploy.ai/'
      INCIDENT_TITLE: '[Publisher Monitor] Availability failure'
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check public application availability
        id: check
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          body="$(curl --fail --silent --show-error --location --max-time 20 "${APP_URL}")"
          grep -q 'Digital Insight Publisher' <<<"${body}"
          curl --fail --silent --show-error --location --max-time 20 "${APP_URL}app-icon.svg" >/dev/null
          printf 'result=healthy\n' >>"${GITHUB_OUTPUT}"

      - name: Open one incident when unavailable
        if: steps.check.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          existing="$(gh issue list --repo "${GITHUB_REPOSITORY}" --state open --search "${INCIDENT_TITLE} in:title" --json number --jq '.[0].number // empty')"
          if [[ -z "${existing}" ]]; then
            gh issue create --repo "${GITHUB_REPOSITORY}" \
              --title "${INCIDENT_TITLE}" \
              --body "The external availability monitor could not load Digital Insight Publisher or its app icon. This monitor checks public reachability only; it does not claim that social-platform OAuth or publishing is healthy. Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          else
            echo "Open incident already exists: #${existing}"
          fi
          exit 1

      - name: Close resolved availability incident
        if: steps.check.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          existing="$(gh issue list --repo "${GITHUB_REPOSITORY}" --state open --search "${INCIDENT_TITLE} in:title" --json number --jq '.[0].number // empty')"
          if [[ -n "${existing}" ]]; then
            gh issue comment "${existing}" --repo "${GITHUB_REPOSITORY}" --body "Availability recovered automatically. Monitor run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            gh issue close "${existing}" --repo "${GITHUB_REPOSITORY}" --reason completed
          fi
          echo 'availability_monitor=healthy'
