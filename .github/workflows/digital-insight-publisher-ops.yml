name: Digital Insight Publisher Ops

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/digital-insight-publisher-ops.yml'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/digital-insight-publisher-ops.yml'
      - 'scripts/check-publisher-ops-policy.mjs'
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: digital-insight-publisher-ops-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: false

jobs:
  source-policy:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check publisher operations policy without credentials
        run: node scripts/check-publisher-ops-policy.mjs

  scheduler-health:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Run due publishing jobs
        id: run_due
        continue-on-error: true
        env:
          DIA_SCHEDULER_TOKEN: ${{ secrets.DIA_SCHEDULER_TOKEN }}
        run: |
          set -euo pipefail
          if [[ ${#DIA_SCHEDULER_TOKEN} -lt 32 ]]; then
            echo '::error::DIA_SCHEDULER_TOKEN must be configured with 32+ characters in both Render and GitHub Actions.'
            exit 1
          fi
          # Node reads the credential from the environment; never print it.
          node --input-type=module <<'NODE'
          import https from 'node:https';
          const token = process.env.DIA_SCHEDULER_TOKEN;
          if (!/^[A-Za-z0-9_-]{32,}$/.test(token || '')) {
            console.error('Scheduler token must contain 32+ URL-safe characters.');
            process.exit(1);
          }
          const request = https.request('https://digital-insight-publisher.onrender.com/api/run-due', {
            method: 'POST',
            headers: { Authorization: 'Bearer ' + token },
          }, response => {
            response.resume();
            response.on('end', () => {
              const status = response.statusCode || 0;
              console.log('Scheduler HTTP status:', status);
              if (status === 401) console.error('Scheduler credential rejected; compare configuration out of band without exposing secrets.');
              if (status < 200 || status >= 300) process.exitCode = 1;
            });
          });
          request.setTimeout(90000, () => request.destroy(new Error('timeout')));
          request.on('error', () => {
            console.error('Scheduler request failed.');
            process.exitCode = 1;
          });
          request.end();
          NODE

      - name: Verify production health and auth configuration
        id: health
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail-with-body --silent --show-error \
            --retry 3 --retry-all-errors --retry-delay 5 --max-time 90 \
            https://digital-insight-publisher.onrender.com/api/health)"
          grep -q '"ok":true' <<< "$response"
          grep -q 'Digital Insight Publisher' <<< "$response"
          grep -q '"authConfigured":true' <<< "$response"

      - name: Verify protected API rejects anonymous access
        id: auth_guard
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          trap 'rm -f /tmp/state-body' EXIT
          code="$(curl --silent --show-error \
            --retry 3 --retry-all-errors --retry-delay 5 --max-time 90 \
            -o /tmp/state-body -w '%{http_code}' \
            https://digital-insight-publisher.onrender.com/api/state)"
          test "$code" = "401"
          grep -q 'authentication_required' /tmp/state-body

      - name: Verify frontend assets and security headers
        id: frontend
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          curl --fail-with-body --silent --show-error \
            --retry 3 --retry-all-errors --retry-delay 5 --max-time 90 \
            https://digital-insight-publisher.onrender.com/ -o /tmp/index.html
          grep -q '<title>Digital Insight Publisher</title>' /tmp/index.html
          curl --fail-with-body --silent --show-error \
            https://digital-insight-publisher.onrender.com/app.js -o /tmp/app.js
          grep -q 'دخول الإدارة' /tmp/app.js
          curl --silent --show-error -D /tmp/headers -o /dev/null \
            https://digital-insight-publisher.onrender.com/
          grep -qi '^content-security-policy:' /tmp/headers
          grep -qi '^x-content-type-options: nosniff' /tmp/headers

      - name: Open one incident issue on failure
        if: steps.run_due.outcome == 'failure' || steps.health.outcome == 'failure' || steps.auth_guard.outcome == 'failure' || steps.frontend.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title='Digital Insight Publisher production health failure'
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$title in:title" --json number --jq '.[0].number // empty')"
          if [ -z "$existing" ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "$title" \
              --body "Automated production, frontend, or security check failed. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          fi
          exit 1

      - name: Report green checks without closing unresolved production incident
        if: steps.run_due.outcome == 'success' && steps.health.outcome == 'success' && steps.auth_guard.outcome == 'success' && steps.frontend.outcome == 'success'
        run: |
          echo "HTTP checks passed. Preserve the incident until scheduled jobs, ephemeral state, and restore evidence have been independently verified." >> "$GITHUB_STEP_SUMMARY"
