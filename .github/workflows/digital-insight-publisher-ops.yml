name: Digital Insight Publisher Ops

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/digital-insight-publisher-ops.yml'
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: digital-insight-publisher-ops
  cancel-in-progress: false

jobs:
  scheduler-health:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      # Scheduled runs are read-only until an independent data recovery/replay approval.
      # Even a matching token must not trigger old queued publications automatically.
      - name: Explain scheduler publication hold
        if: github.event_name != 'workflow_dispatch' || vars.DIA_SCHEDULER_RELEASE_APPROVED != 'true'
        run: |
          echo 'Publisher scheduler execution is HELD. Scheduled runs perform health observations only.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Manual workflow_dispatch plus separately approved DIA_SCHEDULER_RELEASE_APPROVED=true is required for controlled execution.' >> "$GITHUB_STEP_SUMMARY"

      - name: Run due publishing jobs
        if: github.event_name == 'workflow_dispatch' && vars.DIA_SCHEDULER_RELEASE_APPROVED == 'true'
        id: run_due
        continue-on-error: true
        env:
          DIA_SCHEDULER_TOKEN: ${{ secrets.DIA_SCHEDULER_TOKEN }}
        run: |
          set -euo pipefail
          if [[ ${#DIA_SCHEDULER_TOKEN} -lt 32 ]]; then
            echo '::error::DIA_SCHEDULER_TOKEN must be configured with 32+ characters in both Render and GitHub Actions.'
            exit 1
          fi
          # Node reads the credential from the environment; never print it.
          node --input-type=module <<'NODE'
          import https from 'node:https';
          const token = process.env.DIA_SCHEDULER_TOKEN;
          if (!/^[A-Za-z0-9_-]{32,}$/.test(token || '')) {
            console.error('Scheduler token must contain 32+ URL-safe characters.');
            process.exit(1);
          }
          const request = https.request('https://digital-insight-publisher.onrender.com/api/run-due', {
            method: 'POST',
            headers: { Authorization: 'Bearer ' + token },
          }, response => {
            response.resume();
            response.on('end', () => {
              const status = response.statusCode || 0;
              console.log('Scheduler HTTP status:', status);
              if (status < 200 || status >= 300) process.exitCode = 1;
            });
          });
          request.setTimeout(90000, () => request.destroy(new Error('timeout')));
          request.on('error', () => {
            console.error('Scheduler request failed.');
            process.exitCode = 1;
          });
          request.end();
          NODE

      - name: Verify production health and auth configuration
        id: health
        continue-on-error: true
        run: |
          response="$(curl --fail-with-body --silent --show-error \
            --retry 3 --retry-all-errors --retry-delay 5 --max-time 90 \
            https://digital-insight-publisher.onrender.com/api/health)"
          echo "$response"
          echo "$response" | grep -q '"ok":true'
          echo "$response" | grep -q 'Digital Insight Publisher'
          echo "$response" | grep -q '"authConfigured":true'

      - name: Verify protected API rejects anonymous access
        id: auth_guard
        continue-on-error: true
        run: |
          code="$(curl --silent --show-error \
            --retry 3 --retry-all-errors --retry-delay 5 --max-time 90 \
            -o /tmp/state-body -w '%{http_code}' \
            https://digital-insight-publisher.onrender.com/api/state)"
          # Never echo unexpected API response bodies into public CI logs.
          test "$code" = "401"
          grep -q 'authentication_required' /tmp/state-body

      - name: Verify frontend assets and security headers
        id: frontend
        continue-on-error: true
        run: |
          curl --fail-with-body --silent --show-error \
            --retry 3 --retry-all-errors --retry-delay 5 --max-time 90 \
            https://digital-insight-publisher.onrender.com/ -o /tmp/index.html
          grep -q '<title>Digital Insight Publisher</title>' /tmp/index.html
          curl --fail-with-body --silent --show-error \
            https://digital-insight-publisher.onrender.com/app.js -o /tmp/app.js
          grep -q 'دخول الإدارة' /tmp/app.js
          curl --silent --show-error -D /tmp/headers -o /dev/null \
            https://digital-insight-publisher.onrender.com/
          grep -qi '^content-security-policy:' /tmp/headers
          grep -qi '^x-content-type-options: nosniff' /tmp/headers

      - name: Summarize publisher check outcomes
        if: always()
        shell: bash
        env:
          RUN_DUE_OUTCOME: ${{ steps.run_due.outcome }}
          HEALTH_OUTCOME: ${{ steps.health.outcome }}
          AUTH_GUARD_OUTCOME: ${{ steps.auth_guard.outcome }}
          FRONTEND_OUTCOME: ${{ steps.frontend.outcome }}
        run: |
          {
            echo '## Publisher Ops checks (credential values never logged)'
            echo ''
            echo '| Control | Outcome |'
            echo '| --- | --- |'
            printf '| Scheduler POST | %s |\n' "$RUN_DUE_OUTCOME"
            printf '| Public health | %s |\n' "$HEALTH_OUTCOME"
            printf '| Anonymous API denial | %s |\n' "$AUTH_GUARD_OUTCOME"
            printf '| Frontend and headers | %s |\n' "$FRONTEND_OUTCOME"
            echo ''
            if [[ "$RUN_DUE_OUTCOME" == 'failure' && "$HEALTH_OUTCOME" == 'success' ]]; then
              echo 'A healthy public endpoint does not prove scheduler authentication works.'
              echo 'Review the sanitized scheduler HTTP status and the private configuration names.'
              echo 'Do not re-enable scheduler publishing until pending jobs and data recovery are reviewed.'
              echo 'Recovery plan: docs/runbooks/publisher-scheduler-401-recovery.md'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Open one incident issue on failure
        if: steps.run_due.outcome == 'failure' || steps.health.outcome == 'failure' || steps.auth_guard.outcome == 'failure' || steps.frontend.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title='Digital Insight Publisher production health failure'
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$title in:title" --json number --jq '.[0].number // empty')"
          if [ -z "$existing" ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "$title" \
              --body "Automated production, frontend, or security check failed. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          fi
          exit 1

      # Do not auto-close incidents based on transient HTTP 2xx signals:
      # health does not establish queue safety, durable state, or external delivery.
      # A human reviewer must verify recovery evidence and close the issue manually.
      - name: Report healthy probes without closing an incident
        if: steps.run_due.outcome == 'success' && steps.health.outcome == 'success' && steps.auth_guard.outcome == 'success' && steps.frontend.outcome == 'success'
        shell: bash
        run: |
          {
            echo 'Probes recovered, but production incidents are NOT auto-closed.'
            echo 'Queue inventory, storage recovery, and actual provider delivery still require independent verification.'
          } >> "$GITHUB_STEP_SUMMARY"
