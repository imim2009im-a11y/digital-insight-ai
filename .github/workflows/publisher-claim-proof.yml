name: Publisher Durable Claim Proof

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/test_publisher_atomic_claim_proof.py"
      - ".github/workflows/publisher-claim-proof.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-atomic-claim:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Run synthetic SQLite concurrency and crash proof
        run: |
          python3 --version
          python3 scripts/test_publisher_atomic_claim_proof.py
